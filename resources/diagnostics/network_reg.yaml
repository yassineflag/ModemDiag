name: "Network Registration Snapshot"
description: "Read current registration across network domains without changing radio settings. Unsupported domains may fail; a successful query alone does not mean registered."
icon: "🌐"
steps:
  - command: "AT+CFUN?"
    description: "Read functionality level without enabling the radio"
    expect: "+CFUN:"
    timeout_ms: 3000
    delay_ms: 300

  - command: "AT+CPIN?"
    description: "Check SIM ready"
    expect: "READY"
    expect_regex: '^\+CPIN:\s*READY\s*$'
    timeout_ms: 5000
    delay_ms: 500

  - command: "AT+COPS?"
    description: "Operator name and access technology"
    expect: "+COPS"
    timeout_ms: 10000
    delay_ms: 500

  - command: "AT+CREG?"
    description: "CS (circuit-switched) registration"
    expect: "+CREG"
    timeout_ms: 5000
    delay_ms: 300

  - command: "AT+CGREG?"
    description: "GPRS registration"
    expect: "+CGREG"
    timeout_ms: 5000
    delay_ms: 300

  - command: "AT+CEREG?"
    description: "EPS/LTE registration"
    expect: "+CEREG"
    timeout_ms: 5000
    delay_ms: 300

  - command: "AT+C5GREG?"
    description: "5G NR registration"
    expect: "+C5GREG"
    timeout_ms: 5000
    delay_ms: 300
    on_failure: continue

  - command: "AT+CGATT?"
    description: "PS attach status"
    expect: "+CGATT"
    expect_regex: '^\+CGATT:\s*1\s*$'
    timeout_ms: 5000
    delay_ms: 300

  - command: "AT+CGDCONT?"
    description: "PDP context list"
    expect: "+CGDCONT"
    timeout_ms: 3000
    delay_ms: 300

  - command: "AT+CGACT?"
    description: "Read activation state of all defined contexts"
    expect: "OK"
    timeout_ms: 5000
    delay_ms: 300
    on_failure: continue

  - command: "AT+CGPADDR"
    description: "IP addresses for all PDP contexts"
    expect: "OK"
    timeout_ms: 5000
    delay_ms: 300
    on_failure: continue
