name: "Network Registration"
description: "Full network attach sequence and registration check"
icon: "🌐"
steps:
  - command: "AT+CFUN=1"
    description: "Set full functionality"
    expect: "OK"
    timeout_ms: 10000
    delay_ms: 2000

  - command: "AT+CMEE=2"
    description: "Enable verbose error reporting"
    expect: "OK"
    timeout_ms: 3000
    delay_ms: 300

  - command: "AT+CPIN?"
    description: "Check SIM ready"
    expect: "READY"
    expect_regex: '^\+CPIN:\s*READY\s*$'
    timeout_ms: 5000
    delay_ms: 500

  - command: "AT+COPS?"
    description: "Operator name and access technology"
    expect: "+COPS"
    timeout_ms: 10000
    delay_ms: 500

  - command: "AT+CREG?"
    description: "CS (circuit-switched) registration"
    expect: "+CREG"
    expect_regex: '^\+CREG:\s*\d+\s*,\s*(?:1|5)(?:\s*,.*)?$'
    timeout_ms: 5000
    delay_ms: 300

  - command: "AT+CGREG?"
    description: "GPRS registration"
    expect: "+CGREG"
    expect_regex: '^\+CGREG:\s*\d+\s*,\s*(?:1|5)(?:\s*,.*)?$'
    timeout_ms: 5000
    delay_ms: 300

  - command: "AT+CEREG?"
    description: "EPS/LTE registration"
    expect: "+CEREG"
    expect_regex: '^\+CEREG:\s*\d+\s*,\s*(?:1|5)(?:\s*,.*)?$'
    timeout_ms: 5000
    delay_ms: 300

  - command: "AT+C5GREG?"
    description: "5G NR registration"
    expect: "+C5GREG"
    expect_regex: '^\+C5GREG:\s*\d+\s*,\s*(?:1|5)(?:\s*,.*)?$'
    timeout_ms: 5000
    delay_ms: 300
    on_failure: continue

  - command: "AT+CGATT?"
    description: "PS attach status"
    expect: "+CGATT"
    expect_regex: '^\+CGATT:\s*1\s*$'
    timeout_ms: 5000
    delay_ms: 300

  - command: "AT+CGDCONT?"
    description: "PDP context list"
    expect: "+CGDCONT"
    timeout_ms: 3000
    delay_ms: 300

  - command: "AT+CGPADDR"
    description: "IP addresses for all PDP contexts"
    expect: "OK"
    timeout_ms: 5000
    delay_ms: 300
    on_failure: continue
