name: "IoT Power Saving (read-only)"
description: "Inspect requested PSM/eDRX settings and registration before investigating delayed reachability. Does not enable power saving or wake a sleeping module. Requested settings do not prove network-granted timers; support varies by firmware."
icon: "🔋"
steps:
  - command: "AT+CFUN?"
    description: "Read radio functionality"
    expect: "+CFUN:"
  - command: "AT+CEREG?"
    description: "Read EPS registration; extended responses may include granted PSM timers"
    expect: "+CEREG:"
  - command: "AT+CPSMS?"
    description: "Read requested power saving mode and timer settings"
    expect: "+CPSMS:"
  - command: "AT+CEDRXS?"
    description: "Read requested extended DRX settings"
    expect: "OK"
  - command: "AT+CEDRXRDP"
    description: "Read dynamic eDRX parameters granted by the network when supported"
    expect: "OK"
