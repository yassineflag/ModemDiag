manufacturer: "u-blox"
profiles:
  sara_r5: SARA-R5
color: "#00aeef"

categories:

  - name: "Network"
    commands:
      - name: "Radio Mode?"
        command: "AT+URAT?"
        profiles: [sara_r5]
        description: "Query preferred radio access technology"
      - name: "LTE Only (legacy)"
        command: "AT+URAT=3"
        description: "Select LTE on module families that define URAT code 3"
      - name: "RAT Preference"
        command: "AT+URAT=9,7,0"
        description: "Set RAT priorities; use AT+URAT=? for the module's allowed codes"
      - name: "Band Config?"
        command: "AT+UBANDSEL?"
        description: "Query band selection on supported module families"

  - name: "GPIO"
    commands:
      - name: "GPIO Config?"
        command: "AT+UGPIOC?"
        profiles: [sara_r5]
        description: "Query GPIO configuration (direction, function)"
      - name: "GPIO Read Caps"
        command: "AT+UGPIOR=?"
        profiles: [sara_r5]
        description: "Query supported GPIO-read parameters"

  - name: "GNSS"
    commands:
      - name: "GNSS Power?"
        command: "AT+UGPS?"
        profiles: [sara_r5]
        description: "Query GNSS power status"
      - name: "GNSS On"
        command: "AT+UGPS=1,0"
        profiles: [sara_r5]
        description: "Enable supported GNSS receiver without aiding"
      - name: "GNSS Off"
        command: "AT+UGPS=0"
        profiles: [sara_r5]
        description: "Disable GNSS engine"
      - name: "Fix"
        command: "AT+UGGLL?"
        profiles: [sara_r5]
        description: "Read stored GLL message (SARA-R5); enable storage with AT+UGGLL=1 first"
      - name: "UBX Msg"
        command: "AT+UGUBX=?"
        profiles: [sara_r5]
        description: "Query UBX protocol message configuration"

  - name: "HTTP"
    commands:
      - name: "HTTP Profile"
        command: "AT+UHTTP=0"
        profiles: [sara_r5]
        description: "Configure HTTP profile 0"
      - name: "HTTP GET"
        command: 'AT+UHTTPC=0,1,"/",""'
        profiles: [sara_r5]
        description: "Perform HTTP GET on profile 0"

  - name: "Security"
    commands:
      - name: "TLS Config?"
        command: "AT+USECPRF?"
        profiles: [sara_r5]
        description: "Query TLS/DTLS security profile configuration"
      - name: "Cert List"
        command: "AT+USECMNG?"
        profiles: [sara_r5]
        description: "List security certificates loaded in module"

  - name: TCP/IP Stack
    commands:
      - name: AT+USOCR
        command: AT+USOCR={protocol}
        description: Create a socket and retain the returned socket ID
        profiles:
        - sara_r5
        params:
        - id: protocol
          label: Protocol
          default: 6=TCP
          type: select
          options:
          - 6=TCP
          - 17=UDP
        caps: AT+USOCR=?
      - name: AT+USOCO
        command: AT+USOCO={socket},"{host}",{port}
        description: Connect an existing socket; use the ID returned by USOCR
        profiles:
        - sara_r5
        params:
        - id: socket
          label: Socket
          default: '0'
        - id: host
          label: Host
          default: example.test
        - id: port
          label: Port
          default: '1883'
      - name: AT+USOWR
        command: AT+USOWR={socket},{length}
        description: Request byte-counted socket input; use prompt/payload automation
        profiles:
        - sara_r5
        params:
        - id: socket
          label: Socket
          default: '0'
        - id: length
          label: Length
          default: '5'
      - name: AT+USORD
        command: AT+USORD={socket},{length}
        description: Read bytes buffered for a socket
        profiles:
        - sara_r5
        params:
        - id: socket
          label: Socket
          default: '0'
        - id: length
          label: Length
          default: '64'
      - name: AT+USOCL
        command: AT+USOCL={socket}
        description: Close an existing socket
        profiles:
        - sara_r5
        params:
        - id: socket
          label: Socket
          default: '0'

  - name: MQTT
    commands:
      - name: AT+UMQTT
        command: AT+UMQTT={opcode},"{value}"
        description: Set MQTT client ID (0) or broker hostname (2); SARA-R5 firmware dependent
        profiles:
        - sara_r5
        params:
        - id: opcode
          label: Opcode
          default: 0=Client ID
          type: select
          options:
          - 0=Client ID
          - 2=Broker hostname
        - id: value
          label: Value
          default: modemdiag
        get: AT+UMQTT?
      - name: AT+UMQTTC
        command: AT+UMQTTC={opcode}
        description: Request MQTT login (1) or logout (0); inspect +UUMQTTC completion
        profiles:
        - sara_r5
        params:
        - id: opcode
          label: Opcode
          default: 1=Login
          type: select
          options:
          - 1=Login
          - 0=Logout
      - name: AT+UMQTTER
        command: AT+UMQTTER
        description: Read the last MQTT operation error
        profiles:
        - sara_r5
