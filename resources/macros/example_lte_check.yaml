name: "LTE Network Check"
description: "Read-only LTE readiness check. Does not enable the radio or change echo/error settings. Inspect context states and addresses; a query passing does not verify Internet access."
steps:
  - command: "AT"
    description: "Check AT interface is responding"
    expect: "OK"
    timeout_ms: 3000
    delay_ms: 200

  - command: "AT+CFUN?"
    description: "Check full functionality without changing it"
    expect_regex: '^\+CFUN:\s*1(?:\s*,.*)?$'
    timeout_ms: 3000
    delay_ms: 300
    on_failure: stop

  - command: "AT+CPIN?"
    description: "Check SIM is ready"
    expect: "READY"
    expect_regex: '^\+CPIN:\s*READY\s*$'
    timeout_ms: 5000
    delay_ms: 500
    on_failure: stop

  - command: "AT+CEREG?"
    description: "Read LTE registration status"
    expect: "+CEREG"
    expect_regex: '^\+CEREG:\s*\d+\s*,\s*(?:1|5)(?:\s*,.*)?$'
    timeout_ms: 5000
    delay_ms: 500

  - command: "AT+CESQ"
    description: "Extended signal quality"
    expect: "+CESQ"
    timeout_ms: 3000
    delay_ms: 300

  - command: "AT+CGACT?"
    description: "Read activation states of all defined contexts"
    expect: "OK"
    timeout_ms: 5000
    delay_ms: 300
    on_failure: continue

  - command: "AT+CGPADDR"
    description: "Read addresses for all contexts"
    expect: "OK"
    timeout_ms: 5000
    delay_ms: 300
    on_failure: continue
